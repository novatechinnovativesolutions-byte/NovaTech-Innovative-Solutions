<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">NovaTech R&amp;D Lab</title>
  <desc id="desc">NovaTech research and development capabilities: IoT and edge computing, embedded systems, robotics and automation, AI and TinyML, PCB design and prototyping, applied research, and product development.</desc>
  <defs>
    <linearGradient id="blueGold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0757FF"/><stop offset=".55" stop-color="#329BFF"/><stop offset="1" stop-color="#FFC400"/></linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123779"/><stop offset="1" stop-color="#030B22"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#1675FF" stop-opacity=".14"/><stop offset="1" stop-color="#1675FF" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#174A9B" flood-opacity=".16"/></filter>
    <style>
      .font{font-family:Inter,Arial,sans-serif}.label{font-size:17px;font-weight:750;fill:#102044;text-anchor:middle}.icon{fill:none;stroke:#0757FF;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.gold{stroke:#E9AD00}.card{fill:#fff;stroke:#D9E6FA;stroke-width:2}.service{transform-box:fill-box;transform-origin:center;transition:transform .25s ease}.service:hover{transform:scale(1.035)}.orbit{transform-box:view-box;transform-origin:500px 500px;animation:spin 40s linear infinite}.orbit2{transform-box:view-box;transform-origin:500px 500px;animation:spinback 54s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinback{to{transform:rotate(-360deg)}}@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.orbit,.orbit2,.pulse{animation:none}}
    </style>
  </defs>
<circle cx="500" cy="500" r="450" fill="url(#glow)"/>
  <g class="orbit" fill="none"><circle cx="500" cy="500" r="425" stroke="url(#blueGold)" stroke-width="2.5" stroke-dasharray="4 14" stroke-linecap="round"/><circle cx="500" cy="75" r="6" fill="#0757FF"/><circle cx="925" cy="500" r="6" fill="#FFC400"/><circle cx="500" cy="925" r="6" fill="#0757FF"/><circle cx="75" cy="500" r="6" fill="#FFC400"/></g>
  <g class="orbit2" fill="none" opacity=".6"><circle cx="500" cy="500" r="270" stroke="url(#blueGold)" stroke-width="2"/><circle cx="500" cy="230" r="5" fill="#FFC400"/><circle cx="770" cy="500" r="5" fill="#0757FF"/><circle cx="500" cy="770" r="5" fill="#FFC400"/><circle cx="230" cy="500" r="5" fill="#0757FF"/></g>
  <!-- Connectors -->
  <g fill="none" stroke="url(#blueGold)" stroke-width="3" opacity=".85"><path d="M500 365V252"/><path d="M605 397L690 312"/><path d="M635 500H720"/><path d="M590 595L650 690"/><path d="M410 595L350 690"/><path d="M365 500H280"/><path d="M395 395L310 310"/></g>
  <g fill="#fff" stroke="url(#blueGold)" stroke-width="3"><circle cx="500" cy="365" r="6"/><circle cx="605" cy="397" r="6"/><circle cx="635" cy="500" r="6"/><circle cx="590" cy="595" r="6"/><circle cx="410" cy="595" r="6"/><circle cx="365" cy="500" r="6"/><circle cx="395" cy="395" r="6"/></g>
  <!-- Central R&D hub -->
  <g filter="url(#shadow)"><circle cx="500" cy="500" r="151" fill="#0757FF" opacity=".08"/><circle cx="500" cy="500" r="137" fill="url(#hub)"/><circle cx="500" cy="500" r="137" fill="none" stroke="url(#blueGold)" stroke-width="3"/><circle cx="500" cy="500" r="125" fill="none" stroke="#fff" stroke-opacity=".17"/></g>
  <!-- Original abstract orbital brand mark -->
  <text x="500" y="491" class="font" text-anchor="middle" font-size="37" font-weight="850" fill="#fff">Nova<tspan fill="#FFC400">Tech</tspan></text>
  <text x="500" y="521" class="font" text-anchor="middle" font-size="24" font-weight="800" fill="#fff" transform="translate(-104.1 -208.7) scale(1.21487 1.4379)">R&amp;D <tspan fill="#FFC400">Lab</tspan></text>
  <path d="M420 541H580" stroke="url(#blueGold)" stroke-width="2" stroke-linecap="round"/>

  <!-- 1 IoT & Edge Computing -->
  <g class="service" filter="url(#shadow)"><circle cx="500" cy="150" r="100" class="card"/><circle cx="500" cy="150" r="88" fill="#F5F9FF" stroke="#E5EEFF"/>
    <g class="icon" transform="translate(465 94)"><rect x="13" y="17" width="44" height="40" rx="6"/><path d="M22 9V17M33 9V17M44 9V17M22 57V65M33 57V65M44 57V65M5 25H13M5 37H13M5 49H13M57 25H65M57 37H65M57 49H65"/><path d="M23 37Q35 23 47 37M28 42Q35 34 42 42"/><circle cx="35" cy="48" r="2" fill="#FFC400" stroke="none"/></g>
    <text x="500" y="188" class="label"><tspan x="500">IoT &amp; Edge</tspan><tspan x="500" dy="21">Computing</tspan></text></g>

  <!-- 2 Embedded Systems -->
  <g class="service" filter="url(#shadow)"><circle cx="760" cy="265" r="100" class="card"/><circle cx="760" cy="265" r="88" fill="#F5F9FF" stroke="#E5EEFF"/>
    <g class="icon" transform="translate(718 207)"><rect x="12" y="10" width="60" height="55" rx="8"/><path d="M22 2V10M35 2V10M48 2V10M61 2V10M22 65V73M35 65V73M48 65V73M61 65V73M4 20H12M4 33H12M4 46H12M72 20H80M72 33H80M72 46H80"/><path d="M29 27L22 37L29 47M52 27L59 37L52 47M42 26L37 48"/></g>
    <text x="760" y="295" class="label"><tspan x="760">Embedded</tspan><tspan x="760" dy="21">Systems</tspan></text></g>

  <!-- 3 Robotics & Automation -->
  <g class="service" filter="url(#shadow)"><circle cx="820" cy="500" r="100" class="card"/><circle cx="820" cy="500" r="88" fill="#FFFCF4" stroke="#FFF0C4"/>
    <g class="icon" transform="translate(773 423)"><path d="M17 77H76L85 87H8Z" fill="#DCE9FF"/><path d="M29 76V66L39 58L51 34L70 46L76 63L69 69M76 63L85 61"/><circle cx="39" cy="58" r="7" fill="#FFC400"/><circle cx="51" cy="34" r="7" fill="#FFC400"/><circle cx="70" cy="46" r="6" fill="#FFC400"/><path d="M24 76V68M16 77V69"/></g>
    <text x="820" y="543" class="label"><tspan x="820">Robotics &amp;</tspan><tspan x="820" dy="21">Automation</tspan></text></g>

  <!-- 4 AI, ML & TinyML -->
  <g class="service" filter="url(#shadow)"><circle cx="700" cy="760" r="100" class="card"/><circle cx="700" cy="760" r="88" fill="#F5F9FF" stroke="#E5EEFF"/>
    <g transform="translate(657 706)" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M39 7C22-1 9 13 14 27C-2 38 8 55 19 56C22 69 39 69 43 57V10Z" stroke="#0757FF" fill="#E1EDFF"/><path d="M48 7C65-1 78 13 73 27C89 38 79 55 68 56C65 69 48 69 44 57V10Z" stroke="#0757FF" fill="#DCEAFF"/><path d="M44 13V60M25 24L36 32M25 46L36 43M63 24L52 32M63 46L52 43" stroke="#F4B900"/><circle cx="25" cy="24" r="3" fill="#FFC400" stroke="none"/><circle cx="25" cy="46" r="3" fill="#FFC400" stroke="none"/><circle cx="63" cy="24" r="3" fill="#FFC400" stroke="none"/><circle cx="63" cy="46" r="3" fill="#FFC400" stroke="none"/></g>
    <text x="700" y="805" class="label"><tspan x="700">AI / ML &amp;</tspan><tspan x="700" dy="21">TinyML</tspan></text></g>

  <!-- 5 PCB Design & Prototyping -->
  <g class="service" filter="url(#shadow)"><circle cx="300" cy="760" r="100" class="card"/><circle cx="300" cy="760" r="88" fill="#FFFCF4" stroke="#FFF0C4"/>
    <g class="icon" transform="translate(255 714)"><rect x="8" y="5" width="78" height="67" rx="5" fill="#E7F0FF"/><rect x="30" y="22" width="34" height="31" rx="4"/><path d="M30 30H18V17H8M30 44H18V60H8M64 30H76V17H86M64 44H76V60H86M39 22V12M51 22V12M39 53V64M51 53V64"/><circle cx="18" cy="17" r="3" fill="#FFC400" stroke="none"/><circle cx="76" cy="60" r="3" fill="#FFC400" stroke="none"/></g>
    <text x="300" y="805" class="label"><tspan x="300">PCB Design &amp;</tspan><tspan x="300" dy="21">Prototyping</tspan></text></g>

  <!-- 6 Applied Research -->
  <g class="service" filter="url(#shadow)"><circle cx="180" cy="500" r="100" class="card"/><circle cx="180" cy="500" r="88" fill="#F5F9FF" stroke="#E5EEFF"/>
    <g class="icon" transform="translate(137 424)"><path d="M27 8H55M35 8V29L19 58C15 66 21 72 29 72H57C65 72 71 66 67 58L51 29V8"/><path d="M24 53H62"/><circle cx="33" cy="46" r="3" fill="#FFC400" stroke="none"/><circle cx="49" cy="60" r="3" fill="#FFC400" stroke="none"/><path d="M71 16L78 9M75 28H85M68 7V0" stroke="#E9AD00"/></g>
    <text x="180" y="543" class="label"><tspan x="180">Applied</tspan><tspan x="180" dy="21">Research</tspan></text></g>

  <!-- 7 Product Development -->
  <g class="service" filter="url(#shadow)"><circle cx="240" cy="265" r="100" class="card"/><circle cx="240" cy="265" r="88" fill="#FFFCF4" stroke="#FFF0C4"/>
    <g class="icon" transform="translate(195 210)"><path d="M10 20L45 4L80 20L45 37Z" fill="#DCE9FF"/><path d="M10 20V59L45 77L80 59V20M45 37V77"/><path d="M25 13L60 30M45 4V20" stroke="#E9AD00"/><path d="M63 47L70 54L83 39" stroke="#E9AD00"/></g>
    <text x="240" y="321" class="label">Product Development</text></g>
  <path d="M390 962H610" stroke="url(#blueGold)" stroke-width="3" stroke-linecap="round"/>
</svg>
