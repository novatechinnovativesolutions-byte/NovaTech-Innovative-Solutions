<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1400 1000"
     width="1400"
     height="1000"
     role="img"
     aria-labelledby="title desc">

  <title id="title">NovaTech Innovative Solutions — Training &amp; Internships</title>
  <desc id="desc">
    NovaTech technology training illustration featuring a central laptop
    surrounded by IoT, AI/ML, Web Development, App Development,
    Embedded Systems and Robotics.
  </desc>

  <defs>

    <!-- ================= GRADIENTS ================= -->

    <linearGradient id="blueGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0757FF"/>
      <stop offset="55%"  stop-color="#3D7CFF"/>
      <stop offset="100%" stop-color="#FFC400"/>
    </linearGradient>

    <linearGradient id="goldBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFC400"/>
      <stop offset="100%" stop-color="#0757FF"/>
    </linearGradient>

    <linearGradient id="laptopScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#061332"/>
      <stop offset="55%"  stop-color="#0B2C70"/>
      <stop offset="100%" stop-color="#0757FF"/>
    </linearGradient>

    <linearGradient id="laptopBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F5F9FF"/>
      <stop offset="100%" stop-color="#AFC7EB"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%"   stop-color="#2975FF" stop-opacity=".24"/>
      <stop offset="55%"  stop-color="#2975FF" stop-opacity=".09"/>
      <stop offset="100%" stop-color="#2975FF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFF06A"/>
      <stop offset="30%"  stop-color="#FFD000"/>
      <stop offset="100%" stop-color="#EAA900"/>
    </linearGradient>

    <!-- ================= SHADOWS ================= -->

    <filter id="shadow"
            x="-40%"
            y="-40%"
            width="180%"
            height="190%">

      <feDropShadow
        dx="0"
        dy="12"
        stdDeviation="16"
        flood-color="#123D91"
        flood-opacity=".18"/>
    </filter>

    <filter id="smallShadow"
            x="-40%"
            y="-40%"
            width="180%"
            height="180%">

      <feDropShadow
        dx="0"
        dy="6"
        stdDeviation="8"
        flood-color="#123D91"
        flood-opacity=".15"/>
    </filter>

    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <!-- ================= STYLES ================= -->

    <style>

      .font {
        font-family:
          Inter,
          "Segoe UI",
          Arial,
          Helvetica,
          sans-serif;
      }

      .node {
        cursor:pointer;
        transition:
          transform .25s ease,
          filter .25s ease;
        transform-box:fill-box;
        transform-origin:center;
      }

      .node:hover {
        transform:scale(1.035);
      }

      .float {
        animation:float 4s ease-in-out infinite;
      }

      .float2 {
        animation:float 4.7s ease-in-out infinite .6s;
      }

      .orbitDot {
        animation:pulse 2.8s ease-in-out infinite;
      }

      @keyframes float {
        0%,100% {
          transform:translateY(0);
        }

        50% {
          transform:translateY(-7px);
        }
      }

      @keyframes pulse {
        0%,100% {
          opacity:.45;
        }

        50% {
          opacity:1;
        }
      }

      @media (prefers-reduced-motion:reduce) {
        .float,
        .float2,
        .orbitDot {
          animation:none;
        }
      }

    </style>

  </defs>


