
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">NovaTech Innovative Solutions</title>
  <desc id="desc">NovaTech connected to seven technology services: IoT, Embedded Systems, Robotics, AI/ML, Web Development, App Development, and Research.</desc>

  <defs>
    <linearGradient id="blueGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0757FF"/>
      <stop offset="55%" stop-color="#329BFF"/>
      <stop offset="100%" stop-color="#FFC400"/>
    </linearGradient>
    <linearGradient id="goldBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFC400"/>
      <stop offset="100%" stop-color="#0757FF"/>
    </linearGradient>
    <radialGradient id="backgroundGlow">
      <stop stop-color="#1675FF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#1675FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102D70"/>
      <stop offset="1" stop-color="#030B22"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#174A9B" flood-opacity=".15"/>
    </filter>
    <style>
      .font { font-family: Inter, Arial, sans-serif; }
      .label { font-size: 19px; font-weight: 750; fill: #102044; text-anchor: middle; }
      .icon { fill: none; stroke: #0757FF; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .gold { stroke: #F4B900; }
      .card { fill: #FFFFFF; stroke: #D9E6FA; stroke-width: 2; }
      .orbit {
        transform-box: view-box;
        transform-origin: 500px 500px;
        animation: spin 38s linear infinite;
      }
      .orbit-reverse {
        transform-box: view-box;
        transform-origin: 500px 500px;
        animation: spin-reverse 52s linear infinite;
      }
      .service {
        transform-box: fill-box;
        transform-origin: center;
        transition: transform .25s ease;
      }
      .service:hover { transform: scale(1.035); }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spin-reverse { to { transform: rotate(-360deg); } }
      @keyframes pulse {
        0%, 100% { opacity: .55; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .orbit, .orbit-reverse, .pulse { animation: none; }
      }
    </style>
  </defs>

  <!-- Background -->
  <circle cx="500" cy="500" r="440" fill="url(#backgroundGlow)"/>

  <!-- Orbital rings -->
  <g class="orbit" fill="none">
    <circle cx="500" cy="500" r="425" stroke="url(#blueGold)"
      stroke-width="2.5" stroke-dasharray="4 14" stroke-linecap="round"/>
    <circle cx="500" cy="75" r="7" fill="#0757FF"/>
    <circle cx="925" cy="500" r="7" fill="#FFC400"/>
    <circle cx="500" cy="925" r="7" fill="#0757FF"/>
    <circle cx="75" cy="500" r="7" fill="#FFC400"/>
    <circle cx="800" cy="132" r="5" fill="#FFC400"/>
    <circle cx="868" cy="760" r="5" fill="#0757FF"/>
    <circle cx="200" cy="868" r="5" fill="#FFC400"/>
    <circle cx="132" cy="200" r="5" fill="#0757FF"/>
  </g>

  <g class="orbit-reverse" fill="none" opacity=".65">
    <circle cx="500" cy="500" r="270" stroke="url(#goldBlue)" stroke-width="2"/>
    <circle cx="500" cy="230" r="5" fill="#FFC400"/>
    <circle cx="770" cy="500" r="5" fill="#0757FF"/>
    <circle cx="500" cy="770" r="5" fill="#FFC400"/>
    <circle cx="230" cy="500" r="5" fill="#0757FF"/>
  </g>

  <!-- Connections: drawn behind the service cards -->
  <g fill="none" stroke="url(#blueGold)" stroke-width="3" opacity=".8">
    <path d="M500 370 V250"/>
    <path d="M600 400 L700 300"/>
    <path d="M630 500 H720"/>
    <path d="M585 595 L650 700"/>
    <path d="M415 595 L350 700"/>
    <path d="M370 500 H280"/>
    <path d="M400 400 L300 300"/>
  </g>

  <g fill="#FFFFFF" stroke="url(#blueGold)" stroke-width="3">
    <circle cx="500" cy="370" r="7"/>
    <circle cx="600" cy="400" r="7"/>
    <circle cx="630" cy="500" r="7"/>
    <circle cx="585" cy="595" r="7"/>
    <circle cx="415" cy="595" r="7"/>
    <circle cx="370" cy="500" r="7"/>
    <circle cx="400" cy="400" r="7"/>
  </g>

  <!-- Central NovaTech hub -->
  <g filter="url(#shadow)">
    <circle cx="500" cy="500" r="151" fill="#0757FF" opacity=".08"/>
    <circle cx="500" cy="500" r="137" fill="url(#hub)"/>
    <circle cx="500" cy="500" r="137" fill="none" stroke="url(#blueGold)" stroke-width="3"/>
    <circle cx="500" cy="500" r="126" fill="none" stroke="#FFFFFF" stroke-opacity=".15"/>
  </g>

  <!-- Abstract NovaTech orbital mark -->

  <text x="500" y="492" class="font" text-anchor="middle"
    font-size="39" font-weight="850" fill="#FFFFFF" transform="translate(-13.3 -18.3) scale(1.02854 1.03636)">
    Nova<tspan fill="#FFC400">Tech</tspan>
  </text>
  <text x="500" y="520" class="font" text-anchor="middle"
    font-size="11" font-weight="650" letter-spacing="2.5" fill="#DDE8FF" transform="translate(-83.72 -761) scale(1.1657 2.48247)">
    INNOVATIVE SOLUTIONS
  </text>
  <path d="M420 542 H580" stroke="url(#blueGold)" stroke-width="2" stroke-linecap="round"/>

  <!-- 1. IoT -->
  <g class="service" filter="url(#shadow)">
    <circle cx="500" cy="150" r="100" class="card"/>
    <circle cx="500" cy="150" r="89" fill="#F5F9FF" stroke="#E5EEFF"/>
    <circle cx="500" cy="150" r="95" fill="none" stroke="#0757FF" stroke-width="2" stroke-dasharray="45 550" class="pulse"/>
    <g class="icon" transform="translate(465 100)">
      <rect x="13" y="14" width="44" height="44" rx="7"/>
      <path d="M22 7 V14 M33 7 V14 M44 7 V14 M22 58 V65 M33 58 V65 M44 58 V65"/>
      <path d="M6 23 H13 M6 35 H13 M6 47 H13 M57 23 H64 M57 35 H64 M57 47 H64"/>
      <path d="M25 35 Q35 23 45 35 M29 40 Q35 34 41 40"/>
      <circle cx="35" cy="46" r="2" fill="#FFC400" stroke="none"/>
    </g>
    <text x="500" y="207" class="label">IoT</text>
  </g>

  <!-- 2. Embedded Systems -->
  <g class="service" filter="url(#shadow)">
    <circle cx="760" cy="265" r="100" class="card"/>
    <circle cx="760" cy="265" r="89" fill="#F5F9FF" stroke="#E5EEFF"/>
    <g class="icon" transform="translate(718 213)">
      <rect x="12" y="10" width="60" height="57" rx="9"/>
      <path d="M22 2 V10 M35 2 V10 M48 2 V10 M61 2 V10"/>
      <path d="M22 67 V75 M35 67 V75 M48 67 V75 M61 67 V75"/>
      <path d="M4 20 H12 M4 34 H12 M4 48 H12 M72 20 H80 M72 34 H80 M72 48 H80"/>
      <path d="M29 28 L22 38 L29 48 M52 28 L59 38 L52 48 M42 27 L37 49"/>
    </g>
    <text x="760" y="306" class="label" font-size="17">
      <tspan x="760">Embedded</tspan>
      <tspan x="760" dy="22">Systems</tspan>
    </text>
  </g>

  <!-- 3. Robotics -->
  <g class="service" filter="url(#shadow)" transform="translate(6 -2)">
    <circle cx="820" cy="500" r="100" class="card"/>
    <circle cx="820" cy="500" r="89" fill="#FFFCF4" stroke="#FFF0C4"/>
    <g class="icon" transform="translate(773 427)">
      <path d="M17 77 H76 L85 87 H8 Z" fill="#DCE9FF"/>
      <path d="M29 76 V66 L39 58"/>
      <circle cx="39" cy="58" r="8" fill="#FFC400"/>
      <path d="M39 58 L51 34"/>
      <circle cx="51" cy="34" r="8" fill="#FFC400"/>
      <path d="M51 34 L70 46"/>
      <circle cx="70" cy="46" r="7" fill="#FFC400"/>
      <path d="M70 46 L76 63 L69 69 M76 63 L85 61"/>
      <path d="M24 76 V68 M16 77 V69"/>
    </g>
    <text x="820" y="543" class="label">Robotics</text>
  </g>

  <!-- 4. AI / ML -->
  <g class="service" filter="url(#shadow)">
    <circle cx="700" cy="760" r="100" class="card"/>
    <circle cx="700" cy="760" r="89" fill="#F5F9FF" stroke="#E5EEFF"/>
    <g transform="translate(657 710)" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M39 7 C22 -1 9 13 14 27 C-2 38 8 55 19 56 C22 69 39 69 43 57 V10 Z"
        stroke="#0757FF" fill="#E1EDFF"/>
      <path d="M48 7 C65 -1 78 13 73 27 C89 38 79 55 68 56 C65 69 48 69 44 57 V10 Z"
        stroke="#0757FF" fill="#DCEAFF"/>
      <path d="M44 13 V60 M25 24 L36 32 M25 46 L36 43 M63 24 L52 32 M63 46 L52 43"
        stroke="#F4B900"/>
      <circle cx="25" cy="24" r="3" fill="#FFC400" stroke="none"/>
      <circle cx="25" cy="46" r="3" fill="#FFC400" stroke="none"/>
      <circle cx="63" cy="24" r="3" fill="#FFC400" stroke="none"/>
      <circle cx="63" cy="46" r="3" fill="#FFC400" stroke="none"/>
    </g>
    <text x="700" y="815" class="label">AI / ML</text>
  </g>

  <!-- 5. Web Development -->
  <g class="service" filter="url(#shadow)">
    <circle cx="300" cy="760" r="100" class="card"/>
    <circle cx="300" cy="760" r="89" fill="#FFFCF4" stroke="#FFF0C4"/>
    <g class="icon" transform="translate(255 713)">
      <rect x="2" y="3" width="86" height="56" rx="7"/>
      <path d="M2 17 H88 M12 10 H14 M21 10 H23 M30 10 H32"/>
      <path d="M28 31 L20 39 L28 47 M43 31 L51 39 L43 47 M60 31 L54 47"/>
      <path d="M18 68 H72 L81 76 H9 Z" fill="#E3EDFF"/>
      <circle cx="72" cy="56" r="18" fill="#FFFFFF" stroke="#0757FF" stroke-width="3"/>
      <path d="M54 56 H90 M72 38 C63 48 63 64 72 74 M72 38 C81 48 81 64 72 74"
        stroke="#0757FF" stroke-width="2"/>
    </g>
    <text x="300" y="818" class="label" font-size="17">
      <tspan x="300">Web</tspan>
      <tspan x="300" dy="21">Development</tspan>
    </text>
  </g>

  <!-- 6. App Development -->
  <g class="service" filter="url(#shadow)" transform="translate(-8 7)">
    <circle cx="180" cy="500" r="100" class="card"/>
    <circle cx="180" cy="500" r="89" fill="#F5F9FF" stroke="#E5EEFF"/>
    <g class="icon" transform="translate(144 425)">
      <rect x="3" y="4" width="54" height="81" rx="9"/>
      <path d="M20 12 H40"/>
      <circle cx="30" cy="76" r="2" fill="#FFC400" stroke="none"/>
      <rect x="12" y="23" width="13" height="13" rx="3" fill="#168BFF" stroke="none"/>
      <rect x="34" y="23" width="13" height="13" rx="3" fill="#FFC400" stroke="none"/>
      <rect x="12" y="43" width="13" height="13" rx="3" fill="#FFC400" stroke="none"/>
      <rect x="34" y="43" width="13" height="13" rx="3" fill="#168BFF" stroke="none"/>
      <circle cx="62" cy="65" r="16" fill="#FFFFFF" stroke="#0757FF"/>
      <path d="M62 55 V75 M52 65 H72 M55 58 L69 72 M69 58 L55 72"/>
    </g>
    <text x="180" y="543" class="label" font-size="17">App Development</text>
  </g>

  <!-- 7. Research -->
  <g class="service" filter="url(#shadow)">
    <circle cx="240" cy="265" r="100" class="card"/>
    <circle cx="240" cy="265" r="89" fill="#FFFCF4" stroke="#FFF0C4"/>
    <g transform="translate(195 208)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 44 L48 26 L81 42 L41 60 Z" fill="#DCE9FF" stroke="#0757FF" stroke-width="3"/>
      <path d="M8 55 L41 72 L81 53 M8 66 L41 83 L81 64" stroke="#0757FF" stroke-width="3"/>
      <circle cx="67" cy="27" r="16" fill="#FFFFFF" stroke="#0757FF" stroke-width="4"/>
      <path d="M78 39 L91 52" stroke="#0757FF" stroke-width="6"/>
      <path d="M25 17 V7 M18 17 L12 11 M32 17 L38 11" stroke="#F4B900" stroke-width="4"/>
      <path d="M25 21 C17 21 19 33 25 33 C31 33 33 21 25 21 Z" fill="#FFC400" stroke="#F4B900" stroke-width="2"/>
    </g>
    <text x="240" y="321" class="label">Research</text>
  </g>

  <!-- Bottom accent -->
  <path d="M390 962 H610" stroke="url(#blueGold)" stroke-width="3" stroke-linecap="round"/>
</svg>
